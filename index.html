<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Packing Lists</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8;
      --paper: #fffdf7;
      --ink: #1a1208;
      --faint: #c8bfa8;
      --accent: #c0392b;
      --accent2: #2c6e49;
      --checked: #a09070;
      --muted: #8a7c66;
      --danger: #c0392b;
      --drag-over: #e8f5e9;
    }
    body {
      background: var(--bg);
      background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--faint) 27px, var(--faint) 28px);
      font-family: 'Courier Prime', monospace;
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Login screen ── */
    #loginScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem; text-align: center;
    }
    #loginScreen h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin-bottom: 0.5rem; }
    #loginScreen p { color: var(--muted); font-size: 0.85rem; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 2.5rem; }
    .google-btn {
      display: flex; align-items: center; gap: 0.75rem;
      font-family: 'Courier Prime', monospace; font-size: 0.9rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase;
      background: var(--paper); border: 1.5px solid var(--ink); color: var(--ink);
      padding: 0.75rem 1.5rem; cursor: pointer; transition: all 0.15s;
    }
    .google-btn:hover { background: var(--ink); color: var(--bg); }
    .google-btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .login-error { margin-top: 1rem; font-size: 0.8rem; color: var(--danger); }

    /* ── App ── */
    #app { display: none; padding: 2rem 1rem 5rem; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 960px; margin: 0 auto 1.5rem; flex-wrap: wrap; gap: 0.5rem;
    }
    .topbar h1 { font-family: 'Playfair Display', serif; font-size: 1.8rem; }
    .topbar-right { display: flex; align-items: center; gap: 1rem; }
    .user-badge { font-size: 0.75rem; color: var(--muted); letter-spacing: 0.06em; }
    .signout-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.7rem; letter-spacing: 0.06em;
      text-transform: uppercase; background: none; border: 1px solid var(--faint);
      color: var(--muted); padding: 0.25rem 0.6rem; cursor: pointer; transition: all 0.15s;
    }
    .signout-btn:hover { border-color: var(--danger); color: var(--danger); }
    .sync-status { font-size: 0.68rem; color: var(--muted); letter-spacing: 0.06em; }
    .sync-status.error { color: var(--danger); }

    /* ── List pill bar ── */
    .list-bar {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem;
      justify-content: center; max-width: 960px; margin: 0 auto 1.5rem;
    }
    .list-pill {
      display: flex; align-items: center; gap: 0.4rem;
      font-family: 'Courier Prime', monospace; font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.05em; background: var(--paper); border: 1.5px solid var(--faint);
      color: var(--muted); padding: 0.4rem 1rem; cursor: pointer;
      transition: all 0.15s; border-radius: 20px;
    }
    .list-pill:hover { border-color: var(--ink); color: var(--ink); }
    .list-pill.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .pill-del { font-size: 0.9rem; background: none; border: none; color: inherit; cursor: pointer; opacity: 0.4; padding: 0; line-height: 1; }
    .list-pill.active .pill-del:hover { opacity: 1; }
    .new-list-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.05em; background: none; border: 1.5px dashed var(--faint);
      color: var(--muted); padding: 0.4rem 1rem; cursor: pointer; border-radius: 20px; transition: all 0.15s;
    }
    .new-list-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Progress ── */
    .progress-wrap { max-width: 400px; margin: 0 auto 0.4rem; background: var(--faint); border-radius: 2px; height: 5px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--accent2); width: 0%; transition: width 0.3s ease; }
    .progress-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.04em; text-align: center; margin-bottom: 1.5rem; }

    /* ── List views ── */
    .list-view { display: none; max-width: 960px; margin: 0 auto; }
    .list-view.active { display: block; }

    .list-header {
      display: flex; align-items: center; gap: 0.75rem;
      margin-bottom: 1.5rem; border-bottom: 2px solid var(--ink); padding-bottom: 0.6rem; flex-wrap: wrap;
    }
    .emoji-btn { font-size: 1.6rem; background: none; border: none; cursor: pointer; line-height: 1; padding: 0; transition: transform 0.15s; }
    .emoji-btn:hover { transform: scale(1.2); }
    .list-name-input {
      font-family: 'Playfair Display', serif; font-size: 1.4rem;
      background: transparent; border: none; border-bottom: 2px dashed transparent;
      color: var(--ink); outline: none; flex: 1; min-width: 100px; transition: border-color 0.15s;
    }
    .list-name-input:focus { border-bottom-color: var(--faint); }
    .list-count { font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 0.06em; margin-left: auto; white-space: nowrap; }

    /* ── Tab bar ── */
    .tab-bar { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; align-items: center; }
    .tab-btn {
      display: flex; align-items: center; gap: 0.35rem;
      font-family: 'Courier Prime', monospace; font-size: 0.72rem; letter-spacing: 0.06em;
      text-transform: uppercase; background: var(--paper); border: 1.5px solid var(--faint);
      color: var(--muted); padding: 0.3rem 0.7rem; cursor: pointer; transition: all 0.15s;
      border-radius: 2px; font-weight: 700; user-select: none;
    }
    .tab-btn:hover { border-color: var(--ink); color: var(--ink); }
    .tab-btn.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
    .tab-btn.drag-over { border-color: var(--accent2); background: var(--drag-over); }
    .tab-count { font-size: 0.62rem; opacity: 0.7; }
    .add-tab-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.05em; background: none; border: 1.5px dashed var(--faint);
      color: var(--muted); padding: 0.3rem 0.7rem; cursor: pointer; border-radius: 2px; transition: all 0.15s;
    }
    .add-tab-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Tab page ── */
    .tab-page { display: none; }
    .tab-page.active { display: block; }
    .page-wrap { background: var(--paper); border: 1.5px solid var(--faint); box-shadow: 4px 4px 0 var(--faint); padding: 2rem; }

    .tab-page-header {
      display: flex; align-items: center; gap: 0.6rem;
      margin-bottom: 1.2rem; border-bottom: 1px dashed var(--faint); padding-bottom: 0.6rem; flex-wrap: wrap;
    }
    .tab-emoji-btn { font-size: 1.2rem; background: none; border: none; cursor: pointer; line-height: 1; padding: 0; transition: transform 0.15s; }
    .tab-emoji-btn:hover { transform: scale(1.2); }
    .tab-name-input {
      font-family: 'Playfair Display', serif; font-size: 1.2rem; flex: 1;
      background: transparent; border: none; border-bottom: 2px dashed transparent;
      color: var(--ink); outline: none; min-width: 80px; transition: border-color 0.15s;
    }
    .tab-name-input:focus { border-bottom-color: var(--faint); }
    .tab-del-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.65rem; letter-spacing: 0.05em;
      text-transform: uppercase; background: none; border: 1px solid var(--faint);
      color: var(--muted); padding: 0.15rem 0.4rem; cursor: pointer; transition: all 0.15s; border-radius: 1px;
    }
    .tab-del-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* ── Columns ── */
    .columns { display: grid; gap: 2rem; }
    .col-1 { grid-template-columns: 1fr; }
    .col-2 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .col-3 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
    .col-4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

    /* ── Section ── */
    .section-wrap { position: relative; }
    .section-wrap.drag-over-section { outline: 2px dashed var(--accent2); outline-offset: 4px; }
    .section-header { display: flex; align-items: center; gap: 0.4rem; margin-bottom: 0.6rem; }
    .drag-handle {
      cursor: grab; color: var(--faint); font-size: 0.9rem; line-height: 1;
      padding: 0 0.2rem; transition: color 0.15s; user-select: none;
    }
    .drag-handle:hover { color: var(--muted); }
    .section-title-input {
      font-weight: 700; font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--accent); background: transparent; border: none;
      border-bottom: 1px dashed transparent; outline: none; flex: 1;
      font-family: 'Courier Prime', monospace; transition: border-color 0.15s;
    }
    .section-title-input:focus { border-bottom-color: var(--accent); }
    .sec-del-btn { font-size: 0.9rem; background: none; border: none; color: var(--faint); cursor: pointer; padding: 0; transition: color 0.15s; }
    .sec-del-btn:hover { color: var(--danger); }

    /* ── Items ── */
    .item {
      display: flex; align-items: flex-start; gap: 0.45rem;
      margin-bottom: 0.3rem; line-height: 1.4; cursor: default;
    }
    .item.dragging { opacity: 0.4; }
    .item.drag-over-item { border-top: 2px solid var(--accent2); }
    .item-handle { cursor: grab; color: var(--faint); font-size: 0.75rem; margin-top: 3px; flex-shrink: 0; user-select: none; line-height: 1; }
    .item-handle:hover { color: var(--muted); }
    .item input[type="checkbox"] {
      appearance: none; -webkit-appearance: none;
      width: 14px; height: 14px; min-width: 14px;
      border: 1.5px solid var(--ink); background: transparent;
      cursor: pointer; margin-top: 2px; position: relative; transition: background 0.15s; flex-shrink: 0;
    }
    .item input[type="checkbox"]:checked { background: var(--ink); }
    .item input[type="checkbox"]:checked::after {
      content: ''; position: absolute; left: 2px; top: -1px; width: 5px; height: 9px;
      border: 2px solid var(--paper); border-top: none; border-left: none; transform: rotate(45deg);
    }
    .item label { font-size: 0.86rem; cursor: pointer; flex: 1; line-height: 1.4; transition: color 0.15s; user-select: none; }
    .item.done label { color: var(--checked); text-decoration: line-through; text-decoration-color: var(--faint); }
    .del-btn { background: none; border: none; color: transparent; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; margin-top: 1px; flex-shrink: 0; transition: color 0.15s; }
    .item:hover .del-btn { color: var(--faint); }
    .del-btn:hover { color: var(--danger) !important; }
    @media (hover: none) { .del-btn { color: var(--faint); } }

    /* ── Section actions ── */
    .sec-actions { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; }
    .sec-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.65rem; letter-spacing: 0.05em;
      text-transform: uppercase; background: none; border: 1px solid var(--faint);
      color: var(--muted); padding: 0.12rem 0.45rem; cursor: pointer; transition: all 0.15s; border-radius: 1px;
    }
    .sec-btn:hover { border-color: var(--ink); color: var(--ink); }

    /* ── Add item ── */
    .add-row { display: flex; gap: 0.4rem; margin-top: 0.75rem; align-items: center; }
    .add-input {
      font-family: 'Courier Prime', monospace; font-size: 0.82rem;
      background: transparent; border: none; border-bottom: 1px dashed var(--faint);
      color: var(--ink); padding: 0.15rem 0.2rem; flex: 1; min-width: 0; outline: none; transition: border-color 0.15s;
    }
    .add-input::placeholder { color: var(--faint); font-style: italic; }
    .add-input:focus { border-bottom-color: var(--ink); }
    .add-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.72rem; font-weight: 700;
      background: none; border: 1px solid var(--faint); color: var(--muted);
      padding: 0.15rem 0.5rem; cursor: pointer; transition: all 0.15s; border-radius: 1px;
    }
    .add-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Add section ── */
    .add-section-row {
      display: flex; gap: 0.5rem; margin-top: 1.5rem; align-items: center;
      border-top: 1px dashed var(--faint); padding-top: 1rem;
    }
    .add-section-input {
      font-family: 'Courier Prime', monospace; font-size: 0.82rem;
      background: transparent; border: none; border-bottom: 1px dashed var(--faint);
      color: var(--ink); padding: 0.15rem 0.2rem; flex: 1; min-width: 0; outline: none;
    }
    .add-section-input::placeholder { color: var(--faint); font-style: italic; }
    .add-section-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.72rem; font-weight: 700;
      background: none; border: 1px solid var(--faint); color: var(--muted);
      padding: 0.2rem 0.6rem; cursor: pointer; transition: all 0.15s; border-radius: 1px;
    }
    .add-section-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    /* ── Global actions ── */
    .global-actions { display: flex; justify-content: center; gap: 1rem; margin-top: 2rem; flex-wrap: wrap; }
    .global-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.73rem; letter-spacing: 0.08em;
      text-transform: uppercase; font-weight: 700; background: none;
      border: 1.5px solid var(--ink); color: var(--ink); padding: 0.4rem 1rem; cursor: pointer; transition: all 0.15s;
    }
    .global-btn:hover { background: var(--ink); color: var(--bg); }

    /* ── Modal ── */
    .modal-bg {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--paper); border: 1.5px solid var(--faint);
      box-shadow: 6px 6px 0 var(--faint); padding: 1.5rem 2rem;
      max-width: 380px; width: 90%;
    }
    .modal h2 { font-family: 'Playfair Display', serif; font-size: 1.3rem; margin-bottom: 1rem; }
    .modal input {
      font-family: 'Courier Prime', monospace; font-size: 1rem;
      background: transparent; border: none; border-bottom: 1.5px solid var(--ink);
      color: var(--ink); padding: 0.3rem 0.2rem; width: 100%; outline: none; margin-bottom: 1rem;
    }
    .modal-actions { display: flex; gap: 0.7rem; justify-content: flex-end; }
    .modal-btn {
      font-family: 'Courier Prime', monospace; font-size: 0.75rem; letter-spacing: 0.06em;
      text-transform: uppercase; font-weight: 700; background: none;
      border: 1.5px solid var(--ink); color: var(--ink); padding: 0.35rem 0.9rem; cursor: pointer; transition: all 0.15s;
    }
    .modal-btn:hover { background: var(--ink); color: var(--bg); }
    .modal-btn.cancel { border-color: var(--faint); color: var(--muted); }
    .modal-btn.cancel:hover { background: var(--faint); color: var(--ink); }

    /* ── Emoji picker ── */
    #emojiPicker {
      display: none; position: fixed; z-index: 300;
      background: var(--paper); border: 1.5px solid var(--faint);
      box-shadow: 4px 4px 0 var(--faint); padding: 0.6rem;
      flex-wrap: wrap; gap: 0.3rem; width: 232px;
    }
    #emojiPicker.open { display: flex; }
    .emoji-opt { font-size: 1.3rem; cursor: pointer; padding: 0.2rem; border-radius: 4px; transition: background 0.1s; }
    .emoji-opt:hover { background: var(--faint); }

    .loading { text-align: center; padding: 4rem; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>

<!-- Login -->
<div id="loginScreen">
  <h1>Packing Lists</h1>
  <p>Sign in to access your lists</p>
  <button class="google-btn" onclick="signInWithGoogle()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
      <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
      <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
      <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </button>
  <p class="login-error" id="loginError"></p>
</div>

<!-- App -->
<div id="app">
  <div class="topbar">
    <h1>Packing Lists</h1>
    <div class="topbar-right">
      <span class="user-badge" id="userBadge"></span>
      <span class="sync-status" id="syncStatus"></span>
      <button class="signout-btn" onclick="signOut()">Sign out</button>
    </div>
  </div>

  <div class="list-bar" id="listBar"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <p class="progress-label" id="progressLabel"></p>
  <div id="listViews"><div class="loading">Loading your lists…</div></div>

  <div class="global-actions">
    <button class="global-btn" onclick="App.resetCurrent()">Reset List</button>
    <button class="global-btn" onclick="App.checkCurrent()">Check All</button>
  </div>
</div>

<!-- Modals -->
<div class="modal-bg" id="newListModal">
  <div class="modal">
    <h2>New List</h2>
    <input id="newListName" placeholder="e.g. Country Fair" maxlength="40" />
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal('newListModal')">Cancel</button>
      <button class="modal-btn" onclick="App.confirmNewList()">Create</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="newTabModal">
  <div class="modal">
    <h2>New Category</h2>
    <input id="newTabName" placeholder="e.g. Clothes" maxlength="40" />
    <div class="modal-actions">
      <button class="modal-btn cancel" onclick="closeModal('newTabModal')">Cancel</button>
      <button class="modal-btn" onclick="App.confirmNewTab()">Create</button>
    </div>
  </div>
</div>

<div id="emojiPicker"></div>

<script src="app.js"></script>
</body>
</html>
